name = "caw-staff-api"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
# The website addresses that may call this API. Add your real site address after you deploy it.
ALLOWED_ORIGINS = "https://caw.charanchinnappa1929.workers.dev,http://localhost:3000"

# Photo and video storage (Cloudflare R2). Create the bucket once with:
#   npx wrangler r2 bucket create caw-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "caw-media"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put STAFF_PASSWORD
#   npx wrangler secret put SESSION_SECRET
